    <title>Kritiraj B — Software Engineer</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme')
          const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#060606' : '#ffffff')
        } catch {}
      })()
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
