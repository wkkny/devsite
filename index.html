<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/profile-picture.png" />
    <meta name="theme-color" content="#f8f9f7" />
    <meta name="description" content="Kritiraj B is a full-stack developer and UI/UX designer based in New Delhi." />
    <title>Kritiraj B — Developer &amp; Designer</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme')
          const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {}
      })()
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
