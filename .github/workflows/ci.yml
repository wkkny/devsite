name: CI

on:
  # PR branches are covered by pull_request; running push there too doubles every run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same branch; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:unit

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each shard gets its own runner, so specs that need a single worker
        # still avoid CPU contention while running in parallel.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell
      # The runner image already ships Chromium's system libraries, so --with-deps
      # only matters on a cold cache. No spec compares screenshots, so the extra
      # fonts it pulls in are not needed on a cache hit.
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium
      # The webServer runs `bun run build` (tsc -b + vite), so this also covers the build.
      - run: bun run test:e2e --shard=${{ matrix.shard }}/3

  # The main ruleset requires a check named "verify"; this rolls the jobs above into it.
  verify:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
